{% extends "base.html" %}

{% block title %}Ventas - STOCKFLOW{% endblock %}

{% block content %}
<div class="container-lg">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="display-5 text-warning fw-bold">
                <i class="fas fa-shopping-cart"></i> Gestión de Ventas
            </h1>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-warning btn-lg"
                    onclick="openSaleModal()">
                <i class="fas fa-receipt"></i> Nueva Venta
            </button>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h6 class="mb-0"><i class="fas fa-search"></i> Buscar Ventas por Fecha</h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="dateFrom" class="form-label">Desde</label>
                            <input type="date" class="form-control" id="dateFrom">
                        </div>
                        <div class="col-md-3">
                            <label for="dateTo" class="form-label">Hasta</label>
                            <input type="date" class="form-control" id="dateTo">
                        </div>
                        <div class="col-md-6 d-grid align-items-end">
                            <button class="btn btn-outline-warning w-100" onclick="searchByDate()">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="salesTable">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Factura</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Valor Total</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="salesTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal para nueva venta -->
    <div class="modal fade" id="saleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title"><i class="fas fa-receipt"></i> Nueva Venta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="saleForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="saleClientId" class="form-label">Cliente ID</label>
                        <input type="number" class="form-control" id="saleClientId" placeholder="Ej: 1003456789" required>
                    </div>
                    <div class="mb-3">
                        <label for="saleClientName" class="form-label">Nombre Cliente</label>
                        <input type="text" class="form-control" id="saleClientName" placeholder="Nombre del cliente" required>
                    </div>
                    <div class="mb-3">
                        <label for="saleProductId" class="form-label">Producto ID</label>
                        <input type="number" class="form-control" id="saleProductId" placeholder="ID del producto" min="1" step="1" required>
                        <div id="saleProductLookup" class="form-text" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="saleProductName" class="form-label">Nombre Producto</label>
                        <input type="text" class="form-control" id="saleProductName" placeholder="Se completa al ingresar el ID" readonly required>
                    </div>
                    <div class="mb-3">
                        <label for="saleQuantity" class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="saleQuantity" placeholder="Cantidad a vender" min="1" step="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="saleUnitPrice" class="form-label">Precio Unitario</label>
                        <input type="number" class="form-control" id="saleUnitPrice" placeholder="Se completa al ingresar el ID" step="0.01" readonly required>
                    </div>
                    <div class="mb-3">
                        <label for="saleTotal" class="form-label">Valor Total (Sin IVA)</label>
                        <input type="number" class="form-control" id="saleTotal" placeholder="Se calcula automáticamente" step="0.01" readonly required>
                    </div>
                    <div class="mb-3">
                        <label for="salePaymentMethod" class="form-label">Método de Pago</label>
                        <select class="form-control" id="salePaymentMethod" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta Débito">Tarjeta Débito</option>
                            <option value="Tarjeta Crédito">Tarjeta Crédito</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-warning">Registrar Venta</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const canDeleteRecords = {{ 'true' if session.get('role') == 'admin' else 'false' }};

    // Cargar ventas
    async function loadSales() {
        try {
            const response = await axios.get('/api/sales');
            const tableBody = document.getElementById('salesTableBody');
            
            if (response.data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay ventas registradas</td></tr>';
                return;
            }
            
            tableBody.innerHTML = response.data.map(sale => `
                <tr>
                    <td><strong>#${sale.id}</strong></td>
                    <td>${sale.client_name}</td>
                    <td>${sale.product_name || 'Producto ' + sale.product_id}</td>
                    <td>${sale.quantity}</td>
                    <td>$${parseFloat(sale.total).toLocaleString('es-CO')}</td>
                    <td>${sale.date}</td>
                    <td>
                        ${canDeleteRecords ? `
                        <button class="btn btn-sm btn-danger" onclick="deleteSale(${sale.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Error cargando ventas:', error);
        }
    }

    let productLookupRequest = 0;

    async function loadSaleProduct() {
        const productId = document.getElementById('saleProductId').value.trim();
        const productName = document.getElementById('saleProductName');
        const unitPrice = document.getElementById('saleUnitPrice');
        const quantity = document.getElementById('saleQuantity');
        const total = document.getElementById('saleTotal');
        const lookupMessage = document.getElementById('saleProductLookup');
        const requestNumber = ++productLookupRequest;

        productName.value = '';
        unitPrice.value = '';
        quantity.value = '';
        quantity.removeAttribute('max');
        total.value = '';
        lookupMessage.textContent = '';
        if (!productId) return;

        lookupMessage.textContent = 'Buscando producto...';
        try {
            const response = await axios.get(`/api/inventory/${encodeURIComponent(productId)}`);
            if (requestNumber !== productLookupRequest || productId !== document.getElementById('saleProductId').value.trim()) return;

            const product = response.data;
            productName.value = product.name || '';
            if (Number(product.price) > 0) {
                unitPrice.value = Number(product.price).toFixed(2);
            }
            quantity.max = product.quantity;

            if (!unitPrice.value) {
                lookupMessage.textContent = 'Este producto no tiene un precio válido en el inventario.';
            } else if (product.quantity < 1) {
                lookupMessage.textContent = 'Producto encontrado, pero no tiene existencias.';
            } else {
                lookupMessage.textContent = `Producto encontrado · ${product.quantity} unidades disponibles`;
            }
        } catch (error) {
            if (requestNumber !== productLookupRequest) return;
            lookupMessage.textContent = error.response?.status === 404
                ? 'No existe un producto con ese ID.'
                : 'No se pudo consultar el producto. Intenta de nuevo.';
        }
    }

    function updateSaleTotal() {
        const quantity = Number(document.getElementById('saleQuantity').value);
        const unitPrice = Number(document.getElementById('saleUnitPrice').value);
        document.getElementById('saleTotal').value = quantity > 0 && unitPrice > 0
            ? (quantity * unitPrice).toFixed(2)
            : '';
    }

    document.getElementById('saleProductId').addEventListener('input', loadSaleProduct);
    document.getElementById('saleQuantity').addEventListener('input', updateSaleTotal);

    // Agregar venta
document.getElementById('saleForm').addEventListener('submit', (e) => {
    const data = {
        client_id: parseInt(document.getElementById('saleClientId').value, 10),
        client_name: document.getElementById('saleClientName').value.trim(),
        product_id: parseInt(document.getElementById('saleProductId').value, 10),
        product_name: document.getElementById('saleProductName').value.trim(),
        quantity: parseInt(document.getElementById('saleQuantity').value, 10),
        unit_price: parseFloat(document.getElementById('saleUnitPrice').value),
        total: parseFloat(document.getElementById('saleTotal').value),
        payment_method: document.getElementById('salePaymentMethod').value
    };

    submitModalForm(e, {
        modalId: 'saleModal',
        submit: () => axios.post('/api/sales', data),
        onSuccess: loadSales,
        successMessage: response => `Venta registrada exitosamente\n\nFactura #${response.data?.invoice?.invoice_id || 'Generada'}`,
        errorMessage: 'Error al registrar venta'
    });
});
    // Buscar por fecha
    async function searchByDate() {
        const date1 = document.getElementById('dateFrom').value;
        const date2 = document.getElementById('dateTo').value;
        
        if (!date1 || !date2) {
            alert('Por favor selecciona ambas fechas');
            return;
        }
        
        try {
            const response = await axios.post('/api/sales/by-date', { date1, date2 });
            const tableBody = document.getElementById('salesTableBody');
            
            if (response.data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay ventas en ese rango de fechas</td></tr>';
                return;
            }
            
            tableBody.innerHTML = response.data.map(sale => `
                <tr>
                    <td><strong>#${sale.id}</strong></td>
                    <td>${sale.client_name}</td>
                    <td>${sale.product_name || 'Producto ' + sale.product_id}</td>
                    <td>${sale.quantity}</td>
                    <td>$${parseFloat(sale.total).toLocaleString('es-CO')}</td>
                    <td>${sale.date}</td>
                    <td>
                        ${canDeleteRecords ? `
                        <button class="btn btn-sm btn-danger" onclick="deleteSale(${sale.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            alert('Error en la búsqueda');
        }
    }

    // Eliminar venta
    async function deleteSale(saleId) {
        if (confirm('¿Estás seguro que deseas eliminar esta venta?')) {
            try {
                await axios.delete(`/api/sales/${saleId}`);
                alert('Venta eliminada');
                loadSales();
            } catch (error) {
                alert('Error al eliminar venta');
            }
        }
    }

    // Cargar al iniciar
    document.addEventListener('DOMContentLoaded', loadSales);
    function openSaleModal() {
        openFormModal('saleModal');
        document.getElementById('saleProductLookup').textContent = '';
        document.getElementById('saleQuantity').removeAttribute('max');
}
</script>
{% endblock %}
