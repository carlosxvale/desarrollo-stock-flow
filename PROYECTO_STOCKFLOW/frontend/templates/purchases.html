{% extends "base.html" %}

{% block title %}Compras - STOCKFLOW{% endblock %}

{% block content %}
<div class="container-lg">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="display-5 text-danger fw-bold">
                <i class="fas fa-dolly"></i> Gestión de Compras
            </h1>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-danger btn-lg" type="button" onclick="openFormModal('purchaseModal')">
                <i class="fas fa-shopping-bag"></i> Nueva Compra
            </button>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="purchasesTable">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Compra</th>
                            <th>Proveedor</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Valor Total</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="purchasesTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">
                                Cargando...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Nueva Compra -->
<div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fas fa-shopping-bag"></i> Nueva Compra
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <form id="purchaseForm">
                <div class="modal-body">

                    <div class="mb-3">
                        <label for="purchaseSupplierId" class="form-label">Proveedor ID</label>
                        <input
                            type="number"
                            class="form-control"
                            id="purchaseSupplierId"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="purchaseSupplierName" class="form-label">Nombre Proveedor</label>
                        <input
                            type="text"
                            class="form-control"
                            id="purchaseSupplierName"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="purchaseProductName" class="form-label">Producto</label>
                        <input
                            type="text"
                            class="form-control"
                            id="purchaseProductName"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="purchaseQuantity" class="form-label">Cantidad</label>
                        <input
                            type="number"
                            class="form-control"
                            id="purchaseQuantity"
                            min="1"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="purchaseTotal" class="form-label">Valor Total</label>
                        <input
                            type="number"
                            class="form-control"
                            id="purchaseTotal"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-danger">
                        Registrar Compra
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const canDeleteRecords = {{ 'true' if session.get('role') == 'admin' else 'false' }};

async function loadPurchases() {
    try {

        const response = await axios.get('/api/purchases');
        const purchases = response.data;

        const tableBody = document.getElementById('purchasesTableBody');

        if (!purchases || purchases.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-muted">
                        No hay compras registradas
                    </td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = purchases.map(purchase => `
            <tr>
                <td><strong>#${purchase.id}</strong></td>
                <td>${purchase.supplier_name || '-'}</td>
                <td>${purchase.product_name || '-'}</td>
                <td>${purchase.quantity || 0}</td>
                <td class="fw-bold">
                    $${parseFloat(purchase.total || 0).toLocaleString('es-CO')}
                </td>
                <td>${purchase.date || '-'}</td>
                <td>
                    ${canDeleteRecords ? `
                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deletePurchase(${purchase.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                    ` : ''}
                </td>
            </tr>
        `).join('');

    } catch (error) {

        console.error(error);

        document.getElementById('purchasesTableBody').innerHTML = `
            <tr>
                <td colspan="7" class="text-center text-danger">
                    Error al cargar compras
                </td>
            </tr>
        `;
    }
}

document.getElementById('purchaseForm').addEventListener('submit', (e) => {
    const data = {
        supplier_id: parseInt(document.getElementById('purchaseSupplierId').value, 10),
        supplier_name: document.getElementById('purchaseSupplierName').value.trim(),
        product_name: document.getElementById('purchaseProductName').value.trim(),
        quantity: parseInt(document.getElementById('purchaseQuantity').value, 10),
        total: parseFloat(document.getElementById('purchaseTotal').value)
    };

    submitModalForm(e, {
        modalId: 'purchaseModal',
        submit: () => axios.post('/api/purchases', data),
        onSuccess: loadPurchases,
        successMessage: 'Compra registrada exitosamente',
        errorMessage: 'Error al registrar compra'
    });
});

async function deletePurchase(purchaseId) {

    if (!confirm('¿Estás seguro que deseas eliminar esta compra?')) {
        return;
    }

    try {

        await axios.delete(`/api/purchases/${purchaseId}`);

        alert('Compra eliminada correctamente');

        await loadPurchases();

    } catch (error) {

        console.error(error);

        alert(
            error.response?.data?.error ||
            'Error al eliminar compra'
        );
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadPurchases();
});

</script>
{% endblock %}
