{% extends "base.html" %}

{% block title %}Proveedores - STOCKFLOW{% endblock %}

{% block content %}
<div class="container-lg">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="display-5 text-primary fw-bold">
                <i class="fas fa-truck-field"></i> Gestión de Proveedores
            </h1>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-primary btn-lg" type="button" onclick="openFormModal('supplierModal')">
                <i class="fas fa-user-plus"></i> Nuevo Proveedor
            </button>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="suppliersTable">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="suppliersTableBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="supplierModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-user-plus"></i> Nuevo Proveedor</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="supplierForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="supplierId" class="form-label">ID (Identificación)</label>
                        <input type="number" class="form-control" id="supplierId" placeholder="Ej: 1003456789" required>
                    </div>
                    <div class="mb-3">
                        <label for="supplierName" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="supplierName" placeholder="Distribuidora ABC" required>
                    </div>
                    <div class="mb-3">
                        <label for="supplierEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="supplierEmail" placeholder="ventas@empresa.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="supplierPhone" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="supplierPhone" placeholder="3001234567" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadSuppliers();
        document.getElementById('supplierForm').addEventListener('submit', saveSupplier);
    });

    async function loadSuppliers() {
        try {
            const response = await axios.get('/api/suppliers');
            const suppliers = Array.isArray(response.data) ? response.data : [];
            const tableBody = document.getElementById('suppliersTableBody');

            if (suppliers.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay proveedores registrados</td></tr>';
                return;
            }

            tableBody.innerHTML = suppliers.map((supplier) => `
                <tr>
                    <td><strong>${supplier.id ?? ''}</strong></td>
                    <td>${supplier.name ?? ''}</td>
                    <td>${supplier.email || '-'}</td>
                    <td>${supplier.cellphone ?? '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${supplier.id})">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error(error);
            document.getElementById('suppliersTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error cargando proveedores</td></tr>';
        }
    }

    function saveSupplier(e) {
        const data = {
            id: Number(document.getElementById('supplierId').value),
            name: document.getElementById('supplierName').value.trim(),
            email: document.getElementById('supplierEmail').value.trim(),
            cellphone: document.getElementById('supplierPhone').value.trim()
        };

        return submitModalForm(e, {
            modalId: 'supplierModal',
            submit: () => axios.post('/api/suppliers', data),
            onSuccess: loadSuppliers,
            successMessage: 'Proveedor registrado exitosamente',
            errorMessage: 'Error al registrar proveedor'
        });
    }

    async function deleteSupplier(supplierId) {
        if (!confirm('¿Estás seguro que deseas eliminar este proveedor?')) {
            return;
        }

        try {
            await axios.delete(`/api/suppliers/${supplierId}`);
            alert('Proveedor eliminado');
            await loadSuppliers();
        } catch (error) {
            console.error(error);
            alert(error.response?.data?.error || 'Error al eliminar proveedor');
        }
    }
</script>
{% endblock %}
